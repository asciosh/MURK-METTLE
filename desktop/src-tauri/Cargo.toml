[package]
name = "murk-mettle-desktop"
version = "0.1.0"
description = "Windows host for the MURK & METTLE browser RPG"
authors = ["asciosh"]
edition = "2021"
rust-version = "1.100"
publish = false

[lib]
name = "murk_mettle_desktop"

[dependencies]
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "=2.7.3"
tauri-plugin-dialog = "=2.8.4"

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
